name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + real GLB tests
        run: pnpm test

      - name: Validate committed GLB assets
        run: |
          node tools/validators/validate-glb.mjs apps/web/public/models/upper_limbs.glb apps/web/public/data/upper_limbs_manifest.json
          node tools/validators/validate-glb.mjs apps/web/public/models/full_body.glb apps/web/public/data/full_body_manifest.json
          node tools/validators/validate-glb.mjs apps/web/public/models/arm_zanatomy_l.glb apps/web/public/data/arm_zanatomy_manifest.json
          node tools/validators/validate-glb.mjs apps/web/public/models/arm_sample.glb apps/web/public/data/arm_manifest.json

      - name: Muscle inventory up to date
        run: node tools/validators/muscle-inventory.mjs --check

      - name: Build
        run: pnpm build

      # M4.2：瀏覽器 smoke QA（headless Chrome + SwiftShader）。驗證 dev server 啟動、full_body 載入、
      # 無 console error、P01/P03/P05 姿勢套用與足部支撐檢查、可產生截圖。
      # 完整 8 姿勢的視覺判讀仍為本機流程（pnpm qa:visual），CI 不做截圖像素比對。
      - name: Visual QA smoke (headless Chrome)
        env:
          BROWSER: /usr/bin/google-chrome
        run: pnpm qa:smoke

      - name: Upload Visual QA smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-smoke
          path: artifacts/visual-qa/smoke/
          if-no-files-found: warn
          retention-days: 14
